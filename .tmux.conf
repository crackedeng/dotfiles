# prefix key
set -g prefix C-b

set -g escape-time 0  # disable delays on escape sequences
set -g mouse on
set -g renumber-windows on  # keep numbering sequential
set -g repeat-time 1000  # increase "prefix-free" window
set -g set-clipboard on
set -g focus-events on

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

set -g base-index 1
set -g pane-base-index 1

set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# Theme: Pink Gradient
set -g pane-border-lines single
set -g pane-border-style fg=#3b1229
set -g pane-active-border-style fg=#ff79c6,bold

# Status bar (transparent)
set -g status-position top
set -g status-style bg=default
set -g status-justify centre
set -g status-left-length 80
set -g status-right-length 80
set -g status-interval 2

# Left: Claude Code status (shown when in a session)
set -g status-left "#(~/.config/tmux/scripts/claude-status.sh #{pane_pid}) "

# Right: pink gradient cpu * mem (dark → light)
set -g status-right "#[fg=#3b1229]*#[fg=#ffd1eb,bold] #(~/.config/tmux/scripts/session-name.sh #S) #[fg=#3b1229]*#[fg=#c2185b,bold] cpu #[fg=#e91e8c,bold]#(~/.config/tmux/scripts/cpu.sh) #[fg=#ff79c6,bold]* #[fg=#ffa4d9,bold]mem #[fg=#ffd1eb,bold]#(~/.config/tmux/scripts/mem.sh) "

# Inactive tabs: deep muted pink dot
set -g window-status-format "#[fg=#6b2f4a,bg=default] ●"

# Active tab: bright pink dot (light pink if zoomed)
set -g window-status-current-format "#[#{?window_zoomed_flag,fg=#ffd1eb,fg=#ff79c6},bg=default,bold] ●"

# Bell: hot red-pink
set -g window-status-bell-style "fg=#ff1744,bold"
set -g window-status-separator ""

# Message bar
set -g message-style bg=default,fg=#ff79c6,bold
set -g message-command-style bg=default,fg=#ffa4d9,bold

# Copy/selection mode
set -g mode-style bg=#c2185b,fg=#ffd1eb,bold

# Keybindings: split
bind c new-window
bind & new-window
bind h previous-window
bind l next-window

bind | split-window -h
bind - split-window -v
bind x confirm-before -p "dummy, you sure wanna close this window huh? (y/n)" kill-pane

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

setw -g mode-keys vi
